spring.application.name=Access-Log-Api

# MongoDB (NoSQL). Local: mongodb://localhost:27017/apollo_access_log
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/apollo_access_log}
spring.data.mongodb.auto-index-creation=true

server.port=${PORT:8081}
spring.jackson.time-zone=America/Sao_Paulo

# Chave que o Apollo-API-Spring (ou outro cliente interno) envia no header X-API-Key.
# Sem ela configurada, todas as rotas (exceto o Swagger) respondem 401.
access-log.api-key=${ACCESS_LOG_API_KEY:}
